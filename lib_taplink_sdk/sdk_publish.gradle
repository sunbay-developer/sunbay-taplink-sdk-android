task sourcesJar(type: Jar) {
    archiveClassifier.convention('sources')
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}


// Because the components are created only during the afterEvaluate phase, you must
// configure your publications using the afterEvaluate() lifecycle method.
afterEvaluate {
    publishing {
        publications {
            // 从ext属性获取版本号（由build.gradle.kts设置）
            def versionName = project.ext.has('versionName') ? project.ext.versionName : '1.0.0'
            def artifactName = file("../build/sunbay-taplink-sdk-android-${versionName}").absolutePath
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
//                from components.findByName('release')
                artifact artifactName + "-release.aar"
                // You can then customize attributes of the publication as shown below.
                groupId 'com.sunmi'
                artifactId sdkArtifactId
                version = versionName
                //   println(a.get('transforms').getProperties())
                //    println(android.properties('transforms'))
                // version=android.properties(versionName)
                pom {
                    name = sdkName
                    description = sdkDescription
                    // If your project has a dedicated site, use its URL here
                    url = sdkUrl
                    developers {
                        developer {
                            name = 'ricardo'
                            email = 'liucheng@sunmi.com'
                        }
                    }
                    licenses {
                        license {
                            //协议类型，一般默认Apache License2.0的话不用改：
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    // Version control info, if you're using GitHub, follow the format as seen here
                    scm {
                        //修改成你的Git地址：
                        connection = sdkConnection
                        developerConnection = sdkDeveloperConnection
                        //分支地址：
                        url = sdkUrl
                    }
                }
                addTaplinkSdkTransitivePomDependencies(pom)
                ext.repo = 'releaseUrl'
            }
            debug(MavenPublication) {
                // Applies the component for the release build variant.
//                from components.debug
                System.out.println("<<<<<" + artifactName + ".aar")
                artifact artifactName + "-debug.aar"
                // You can then customize attributes of the publication as shown below.
                groupId 'com.sunmi'
                artifactId sdkArtifactId
                version = versionName + '-SNAPSHOT'
                pom {
                    name = sdkName
                    description = sdkDescription
                    url = sdkUrl
                    developers {
                        developer {
                            name = 'ricardo'
                            email = 'liucheng@sunmi.com'
                        }
                    }
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    scm {
                        connection = sdkConnection
                        developerConnection = sdkDeveloperConnection
                        url = sdkUrl
                    }
                }
                addTaplinkSdkTransitivePomDependencies(pom)
                ext.repo = 'snapshotUrl'
            }
        }
        repositories {
            maven {
                name("releaseUrl")
                url = getReleaseRepositoryUrl()
                credentials {
                    username = getRepositoryUsername()
                    password = getRepositoryPassword()
                }
            }
            maven {
                name("snapshotUrl")
                url = getSnapshotRepositoryUrl()
                credentials {
                    username = getRepositoryUsername()
                    password = getRepositoryPassword()
                }
            }
        }

        signing {
            // 只对release版本进行签名，跳过debug版本
            required { gradle.taskGraph.hasTask("publish") && !version.endsWith('-SNAPSHOT') }
            sign publishing.publications.release
        }
    }
    tasks.withType(Sign) { task ->
        // Ensure sign tasks depend on copyReleaseAar / copyDebugAar to avoid task dependency validation errors
        if (task.name == 'signReleasePublication') {
            task.dependsOn('copyReleaseAar')
        } else if (task.name == 'signDebugPublication') {
            task.dependsOn('copyDebugAar')
        }
    }

    tasks.withType(PublishToMavenRepository) { task ->
        if (task.publication.hasProperty('repo') && task.publication.repo != task.repository.name) {
            task.enabled = false
            task.group = null
        }
        // 确保发布前先重新构建并复制最新 AAR，避免发布 ../build 下的旧包
        if (task.publication.name == 'debug') {
            task.dependsOn('copyDebugAar')
        } else if (task.publication.name == 'release') {
            task.dependsOn('copyReleaseAar')
        }
        task.doLast {
            def username = getRepositoryUsername()
            def password = getRepositoryPassword()
            def url = new URL('https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.sunmi')
            def connection = (HttpURLConnection) url.openConnection()
            connection.requestMethod = 'POST'
            connection.setRequestProperty('Content-Type', 'application/json')
            connection.setRequestProperty('Authorization', 'Basic ' + "$username:$password".bytes.encodeBase64().toString())

            def responseCode = connection.responseCode
            println "--->HTTP Response Code: $responseCode<---"
            connection.disconnect()
        }
    }
}



