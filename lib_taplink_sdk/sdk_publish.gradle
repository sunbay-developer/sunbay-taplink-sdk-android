apply plugin: 'maven-publish'
apply plugin: 'signing'

//每个项目自定义
def sdkProjectName = "sunbay-taplink-sdk-android"
def sdkArtifactId = "${sdkProjectName}"
def sdkName = "${sdkProjectName}"
def sdkDescription = "${sdkProjectName}"
// 这里使用main分支
def sdkUrl = "http://code.sunmi.com/sunbay/App/tapro.git/-/tree/main"
def sdkConnection = "scm:git@code.sunmi.com:sunbay/App/tapro.git"
def sdkDeveloperConnection = "scm:git@code.sunmi.com:sunbay/App/tapro.git"

// 与 gradle/libs.versions.toml 保持一致；手动发布 AAR 时需在 POM 中显式声明传递依赖，集成方只需依赖本 SDK 即可解析到下列库。
def addTaplinkSdkTransitivePomDependencies = { pom ->
    pom.withXml {
        def dependenciesNode = asNode().appendNode('dependencies')
        def addDep = { String g, String a, String v ->
            def dep = dependenciesNode.appendNode('dependency')
            dep.appendNode('groupId', g)
            dep.appendNode('artifactId', a)
            dep.appendNode('version', v)
            dep.appendNode('scope', 'compile')
        }
        addDep('com.fasterxml.jackson.core', 'jackson-databind', '2.17.2')
        addDep('com.fasterxml.jackson.module', 'jackson-module-kotlin', '2.17.2')
        addDep('org.java-websocket', 'Java-WebSocket', '1.5.3')
        addDep('com.github.mik3y', 'usb-serial-for-android', '3.7.0')
    }
}

