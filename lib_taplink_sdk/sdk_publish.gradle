apply plugin: 'maven-publish'
apply plugin: 'signing'

//每个项目自定义
def sdkProjectName = "sunbay-taplink-sdk-android"
def sdkArtifactId = "${sdkProjectName}"
def sdkName = "${sdkProjectName}"
def sdkDescription = "${sdkProjectName}"
// 这里使用main分支
def sdkUrl = "http://code.sunmi.com/sunbay/App/tapro.git/-/tree/main"
def sdkConnection = "scm:git@code.sunmi.com:sunbay/App/tapro.git"
def sdkDeveloperConnection = "scm:git@code.sunmi.com:sunbay/App/tapro.git"

// 与 gradle/libs.versions.toml 保持一致；手动发布 AAR 时需在 POM 中显式声明传递依赖，集成方只需依赖本 SDK 即可解析到下列库。
def addTaplinkSdkTransitivePomDependencies = { pom ->
    pom.withXml {
        def dependenciesNode = asNode().appendNode('dependencies')
        def addDep = { String g, String a, String v ->
            def dep = dependenciesNode.appendNode('dependency')
            dep.appendNode('groupId', g)
            dep.appendNode('artifactId', a)
            dep.appendNode('version', v)
            dep.appendNode('scope', 'compile')
        }
        addDep('org.java-websocket', 'Java-WebSocket', '1.5.3')
        addDep('com.github.mik3y', 'usb-serial-for-android', '3.7.0')
    }
}

static def getReleaseRepositoryUrl() {
//    return "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
    return "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
//    return "/Users/sm2735/snapshots/"
}

static def getSnapshotRepositoryUrl() {
//    return "https://s01.oss.sonatype.org/content/repositories/snapshots/"
//    return "https://ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/"
    return "https://central.sonatype.com/repository/maven-snapshots/"

}

// 凭证一律从未提交的 Gradle 属性或环境变量注入，禁止硬编码到被 Git 追踪的文件中。
// 优先级：Gradle 属性 sunbayMavenUsername/sunbayMavenPassword > 环境变量 SUNBAY_MAVEN_USERNAME/SUNBAY_MAVEN_PASSWORD。
// 两者都缺失时返回空字符串；是否必须由实际发布 task 决定（见下方 doFirst 校验）。
def getRepositoryUsername = {
    return project.findProperty('sunbayMavenUsername') ?: System.getenv('SUNBAY_MAVEN_USERNAME') ?: ''
}

def getRepositoryPassword = {
    return project.findProperty('sunbayMavenPassword') ?: System.getenv('SUNBAY_MAVEN_PASSWORD') ?: ''
}

task sourcesJar(type: Jar) {
    archiveClassifier.convention('sources')
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}


// Because the components are created only during the afterEvaluate phase, you must
// configure your publications using the afterEvaluate() lifecycle method.
afterEvaluate {
    publishing {
        publications {
            // 从ext属性获取版本号（由build.gradle.kts设置）
            def versionName = project.ext.has('versionName') ? project.ext.versionName : '1.0.0'
            def artifactName = file("../build/sunbay-taplink-sdk-android-${versionName}").absolutePath
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
//                from components.findByName('release')
                artifact artifactName + "-release.aar"
                // You can then customize attributes of the publication as shown below.
                groupId 'com.sunmi'
                artifactId sdkArtifactId
                version = versionName
                //   println(a.get('transforms').getProperties())
                //    println(android.properties('transforms'))
                // version=android.properties(versionName)
                pom {
                    name = sdkName
                    description = sdkDescription
                    // If your project has a dedicated site, use its URL here
                    url = sdkUrl
                    developers {
                        developer {
                            name = 'ricardo'
                            email = 'liucheng@sunmi.com'
                        }
                    }
                    licenses {
                        license {
                            //协议类型，一般默认Apache License2.0的话不用改：
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    // Version control info, if you're using GitHub, follow the format as seen here
                    scm {
                        //修改成你的Git地址：
                        connection = sdkConnection
                        developerConnection = sdkDeveloperConnection
                        //分支地址：
                        url = sdkUrl
                    }
                }
                addTaplinkSdkTransitivePomDependencies(pom)
                ext.repo = 'releaseUrl'
            }
            debug(MavenPublication) {
                // Applies the component for the release build variant.
//                from components.debug
                System.out.println("<<<<<" + artifactName + ".aar")
                artifact artifactName + "-debug.aar"
                // You can then customize attributes of the publication as shown below.
                groupId 'com.sunmi'
                artifactId sdkArtifactId
                version = versionName + '-SNAPSHOT'
                pom {
                    name = sdkName
                    description = sdkDescription
                    url = sdkUrl
                    developers {
                        developer {
                            name = 'ricardo'
                            email = 'liucheng@sunmi.com'
                        }
                    }
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    scm {
                        connection = sdkConnection
                        developerConnection = sdkDeveloperConnection
                        url = sdkUrl
                    }
                }
                addTaplinkSdkTransitivePomDependencies(pom)
                ext.repo = 'snapshotUrl'
            }
        }
        repositories {
            maven {
                name("releaseUrl")
                url = getReleaseRepositoryUrl()
                credentials {
                    username = getRepositoryUsername()
                    password = getRepositoryPassword()
                }
            }
            maven {
                name("snapshotUrl")
                url = getSnapshotRepositoryUrl()
                credentials {
                    username = getRepositoryUsername()
                    password = getRepositoryPassword()
                }
            }
        }

        signing {
            // 只对release版本进行签名，跳过debug版本
            required { gradle.taskGraph.hasTask("publish") && !version.endsWith('-SNAPSHOT') }
            sign publishing.publications.release
        }
    }
    tasks.withType(Sign) { task ->
        // Ensure sign tasks depend on copyReleaseAar / copyDebugAar to avoid task dependency validation errors
        if (task.name == 'signReleasePublication') {
            task.dependsOn('copyReleaseAar')
        } else if (task.name == 'signDebugPublication') {
            task.dependsOn('copyDebugAar')
        }
    }

    tasks.withType(PublishToMavenRepository) { task ->
        if (task.publication.hasProperty('repo') && task.publication.repo != task.repository.name) {
            task.enabled = false
            task.group = null
        }
        // 确保发布前先重新构建并复制最新 AAR，避免发布 ../build 下的旧包
        if (task.publication.name == 'debug') {
            task.dependsOn('copyDebugAar')
        } else if (task.publication.name == 'release') {
            task.dependsOn('copyReleaseAar')
        }
        // 凭证缺失时立即失败，避免匿名/空凭证请求走到远端才报错。
        task.doFirst {
            if (!getRepositoryUsername() || !getRepositoryPassword()) {
                throw new GradleException(
                    '缺少 Maven 发布凭证。请通过 Gradle 属性 sunbayMavenUsername/sunbayMavenPassword ' +
                    '或环境变量 SUNBAY_MAVEN_USERNAME/SUNBAY_MAVEN_PASSWORD 注入后重试。'
                )
            }
        }
        // 说明：原先此处有一个 doLast，会在每个 publish task 之后隐式向 Central
        // manual upload 端点发起 HTTP POST，且仅 println 状态码、不判失败。
        // 该网络副作用已移除，改由发布脚本（ci/release/publish_sdk.sh）在推送后
        // 显式触发 manual upload 并校验 HTTP 返回码。
    }
}


