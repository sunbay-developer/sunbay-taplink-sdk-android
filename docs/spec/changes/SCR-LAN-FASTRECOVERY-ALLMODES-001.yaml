# ── What changed (before / after) ────────────────────────────────────────────────────
before:
  status: active (v1.1)
  summary: >
    SPEC-LAN-RECOVERY-001 R8 (SRC-3, Approved via SCR-LAN-TRACEID-REBIND-001): "This plan requires NO
    SDK code change for LAN. The `canFastRecover` `isLanMode` gate is retained as-is; widening it to
    Cable is out of scope and deferred to a separate change." AC8: "canFastRecover still gates on
    isLanMode with no code change and no Cable widening; the existing fast-recovery regression suite
    stays green with no SDK diff." This no-longer matches the working-tree code, which removed the
    isLanMode gate.
after:
  status: PROPOSED                       # Type B DESIGN_DECISION; MUST stay PROPOSED until the human L3 gate.
  summary: >
    Rewrite R8/AC8 so the spec matches the widened code. The OPT-R1 in-flight fast-recovery ENTRY
    judgment no longer gates on the connection mode. It is extracted into the pure internal function
    `computeCanFastRecover(autoReconnectEnabled, isManual, hasInFlight, isFastRecovering, isReconnecting,
    hasConnectionConfig)` and returns true only when ALL runtime conditions hold: autoReconnect enabled,
    non-manual disconnect, has in-flight transaction, not already fast-recovering, not already
    reconnecting, has a reusable connection config. Connection mode is no longer a parameter. The
    judgment layer is therefore widened to all modes (LAN / Cable USB_VSP·RS232·USB_AOA / App-to-App /
    Cloud); the RUNTIME layer remains bounded by the onDisconnected `isConnectionError` disconnect-code
    classification, so only LAN (WebSocket 1000/1001/1006) disconnects actually reach the judgment —
    non-LAN modes are classified into the connection-error branch (or produce no SDK onDisconnected)
    and the widening is a runtime no-op for them. `computeCanFastRecover` is INTERNAL (not public API).
  proposed_rules:
    - id: R8
      statement: >
        OPT-R1 in-flight fast-recovery ENTRY is mode-agnostic: `computeCanFastRecover` does NOT gate on
        the connection mode. Entry is decided purely by runtime conditions — autoReconnect enabled AND
        non-manual disconnect AND has in-flight transaction AND not already fast-recovering AND not
        already reconnecting AND has a reusable connection config. The judgment layer is widened to all
        connection modes (LAN / Cable / App-to-App / Cloud); the runtime layer stays bounded by the
        onDisconnected `isConnectionError` disconnect-code classification, so in practice only LAN
        (WebSocket close codes 1000/1001/1006) disconnects reach the judgment and non-LAN modes are a
        runtime no-op (harmless widening). `computeCanFastRecover` is an internal pure function (not
        public API); no new public API, no new error code, no new transaction-identity anchor are added.
      criticality: high
      status: PROPOSED                   # pending human L3 approval; NEVER set APPROVED in this draft

# ── Impact analysis ──────────────────────────────────────────────────────────────────
impact:
  acceptance_criteria: [AC8]             # AC8 rewritten; AC8b added (non-LAN no-op). AC6/AC7/AC9/AC10 unchanged.
  harmless_widening:
    conclusion: >
      Harmless-widening. Removing the isLanMode gate widens the JUDGMENT layer to all modes, but the
      RUNTIME layer is naturally bounded by onDisconnected `isConnectionError`: only disconnects
      reporting WebSocket close codes 1000/1001/1006 enter the normalDisconnect branch and reach
      computeCanFastRecover, and only the LAN (WebSocket) transport produces those codes.
    per_mode:
      LAN: "Reaches computeCanFastRecover (close codes 1000/1001/1006 -> normalDisconnect branch). Fast recovery works as originally designed; R7/R9 behavior unchanged."
      Cable_VSP_RS232_AOA: "Passive disconnect reports E212/E232/E251.. (connectionErrorCodes) -> isConnectionError=true -> connection-error branch, which has no fast-recovery call. Never reaches computeCanFastRecover. Runtime no-op."
      AppToApp: "Process-crash disconnect reports E213 (connectionErrorCodes) -> connection-error branch. (in-flight + passive-drop) combination unreachable. Runtime no-op."
      Cloud: "SDK never builds/drives a Cloud connection (ProtocolConfigResolver has no Cloud branch; ServiceType is SERIAL/VSP/LOCAL/LAN only), so no onDisconnected event exists. Runtime no-op."
  relationship_to_other_rules:
    R6: "Unchanged. R6 scopes pre-connection LAN handshake recovery; the widening is on the established-link in-flight fast-recovery entry, already carved out of R6 and covered by R7/R8."
    R7: "Unchanged. R7 (isFastRecovering suppresses paired disconnect cleanup; 180s callback timeout is the authoritative in-flight callback lifetime) is NOT affected by the entry-scope widening — the suppression/timeout mechanics are identical; only which modes can ENTER the path changed, and non-LAN modes do not reach it at runtime."
    R9: "Unchanged. R9's FAST_RECOVERY_BUDGET_MS=5s window and the 180s callback timeout are untouched (ConnectionManager FAST_RECOVERY_BUDGET_MS and tryFastRecovery/fastRecoveryFallback unchanged). The 5s budget vs 180s timeout boundary and E306->E213 fallback are not re-timed by this change. Because only LAN reaches the path at runtime, the 180s/5s boundaries continue to apply exactly as before."
    R10: "Unchanged. R10's identity boundary (traceId globally unique; no new public API / error code / identity anchor) is preserved: computeCanFastRecover is internal, adds no public surface, and does not introduce any per-mode identity anchor. The appId guard remains a Host-side authorization boundary; this SDK change neither extends nor relaxes that boundary for non-LAN modes."
  new_acs_assessment: >
    One new AC is added (AC8b) to assert the Step-1 conclusion explicitly: non-LAN modes
    (Cable / App-to-App / Cloud) are NOT dragged into fast recovery at runtime because their passive
    disconnects are classified as connection errors (or produce no SDK onDisconnected), so the widened
    entry judgment is a no-op for them. No separate "Cable passive-disconnect fast recovery" positive
    AC is added, because the Step-1 analysis proves that path is currently unreachable; adding a
    positive Cable AC would assert behavior the code does not actually exhibit. AC8 is rewritten to
    assert the mode-agnostic entry judgment via the pure function.
  public_api_change: false               # computeCanFastRecover is internal
