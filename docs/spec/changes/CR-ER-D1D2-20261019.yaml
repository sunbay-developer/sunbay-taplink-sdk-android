    "red_green": "watchdogSettlesFailureWhenEpisodeScopeIsStarved and nonExplicitCancellationBackStopsSingleFailure were proven RED before the fix (both time out with no terminal callback when the watchdog start and the D2 back-stop are disabled) and GREEN after. The two cross-epoch two-generation regressions (staleEpisodeResumingAfterWatchdogSettleDoesNotPoisonNextEpisode, staleExplicitDetachCancellationDoesNotPoisonNextEpisode) were proven RED by temporarily reintroducing the pre-fix coordinator-global settle/explicit-detach gate (both time out: episode B is left with no terminal callback because stale episode A burned B's shared gate) and GREEN with the per-episode EpisodeControl. liveWatchdogIsCancelledAndSwallowedByNormalSuccessSettle (a genuinely live, looping watchdog cancelled by the winning success settle under the lock, replacing the earlier eager-dispatch variant that never actually entered the watchdog's settleFailure) and the formal-parameter-only listener regression pass after the fix. Second follow-up review (review-B) regressions: failureSettleKeepsRecoveryGateClosedUntilHostCleanupCompletes and successSettleKeepsRecoveryGateClosedUntilHostReattachCompletes were proven RED against the pre-review-B single-phase settle (gate dropped before Host teardown) — the two gate tests fail their 'gate must stay closed throughout host teardown' assertion — and GREEN after the two-phase claim/finalize settle. The formal-parameter-only listener regression (formalParameterOnlyListenerGetsOneDisconnectOnTimeout) drives the listener through the real public connect(endpoint, listener) binding chain (establish, then force a 1006 + budget-exhausting timeout) instead of reflectively seeding the private pending queue; it is a preservation/integration coverage of the binding contract (under Unconfined + fast clock the normal poll also completes) rather than a D1 pre-fix RED, and passes after the fix. Third follow-up review (review iteration) blocking regressions: settlingWindowJoinIsAdmittedAndReceivesTheSingleTerminalOutcome (coordinator level) and sameConfigConnectDuringSettlingWindowDoesNotStrandTheTerminalCallback (ConnectionManager level, exercising the real connect()->join/disconnect wiring) were both proven RED against the review-B settled-rejecting joinIfRecovering: the coordinator-level test fails its assertion (the rejected late joiner receives zero callbacks instead of one E213), and the ConnectionManager-level test TIMES OUT because the same-config connect() fell into disconnect()/onExplicitDetachOrDisconnect() and cleared the original observer's episodeObservers, stranding its terminal E213. Both are GREEN after the settling-window join fix (join admitted while the generation is still current, so the original observer and the late caller each receive exactly one E213 from the deferred snapshot). The prior join test (which asserted rejection) is removed/replaced because it locked in the defective behavior.",
