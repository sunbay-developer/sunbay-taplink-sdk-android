    "status": "CONFORMANCE_FIX_APPLIED",
    "implementation": "D1: an independent budget watchdog coroutine is started per episode on a separate scope (watchdogScope) backed by an injectable watchdogDispatcher that defaults to Dispatchers.Default, so the 'deadline reached => settleFailure' guarantee is driven off a dispatcher that is NOT the Main-confined episode scope and survives Main starvation/ANR. The watchdog re-reads the same injected monotonic clock against episode.deadlineElapsedMs; on reaching the deadline it calls settleFailure for its episode control. D2: a per-episode cancelledByExplicitDetach flag, set only by onExplicitDetachOrDisconnect() on the current generation's control, lets runEpisode's CancellationException branch back-stop a single settleFailure when the cancellation is NOT an explicit detach and the episode is still unsettled, then still rethrow the CancellationException to honor structured-concurrency propagation. Explicit detach keeps delivering no callback, unchanged. Cross-epoch hardening (follow-up review): all mutable settle/cancel state (the one-shot settled gate, the explicit-detach flag, and the episode/watchdog Jobs) is bundled into an immutable-per-generation EpisodeControl bound to one RecoveryEpisode; the coordinator keeps a single currentControl. The terminal settle is centralized in a single @Synchronized claimTerminalSettle(control) that, inside one lock, (1) returns unless control is still currentControl, (2) wins control's OWN settled CAS. This removes the previous CAS-before-epoch check-then-act window: a stale/late episode settling against its own no-longer-current control can never flip a successor episode's gate, so a new episode cannot be left silent by an old one. The explicit-detach path mirrors the same locked teardown. Watchdog lifecycle stays episode-bound (cancelled on settle/detach). Second follow-up review (review-B) hardening: (1) the terminal settle is split into two synchronized phases — claimTerminalSettle wins the one-shot gate and cancels THIS generation's jobs but deliberately KEEPS the PaymentManager recovery gate (setEstablishedRecoveryActive), currentControl and the recovering flag HELD; the Host-side teardown (onRecoverySuccess re-attach / onRecoveryFailureCleanup fail+clear) then runs while the gate is still closed and the generation still owned; only afterwards does finalizeTerminalSettle drop the gate, clear currentControl/recovering, and snapshot+clear the observers under the same lock. This closes the window where the gate was dropped before Host teardown finished, during which a new request could be sent on a dying link and then killed by this episode's own cleanup, or a new fault could claim a successor episode that the old episode's teardown would poison. (2) joinIfRecovering is @Synchronized on the coordinator monitor (same lock as claim/finalize/detach). (3) startWatchdog guards the synchronous-settle-before-watchdog-start ordering: if the episode already settled (e.g. prerequisite denial / already-past deadline on an eager/Unconfined dispatcher) before the watchdog Job existed, the watchdog is not launched (and is cancelled if it settles in the launch gap), so no stale ~5s Job accumulates on fast consecutive failures. Third follow-up review (review iteration) blocking fix — settling-window join + finalize guard + teardown try/finally: the previous review-B hardening made joinIfRecovering reject a same-config join as soon as control.settled became true (i.e. during the phase1(won)->Host-teardown->finalize settling window). That was wrong: the real ConnectionManager.connect() does NOT return on a false join — it falls through, and because connectionStatus is still CONNECTED while isConnected()==false during recovery, it calls disconnect() -> onExplicitDetachOrDisconnect(), which clears the live episodeObservers the winning settle still had to notify, STRANDING the original observer's terminal onDisconnected(E213) and violating AC6 and the core goal of this fix. Because the observer snapshot is deliberately deferred to finalizeTerminalSettle, the observer set is still live and not yet cleared throughout the settling window, so admitting a same-config joiner there is safe and correct: joinIfRecovering now admits any same-config joiner for as long as THIS generation is still current (i.e. until finalizeTerminalSettle flips recovering=false / drops currentControl under the same lock), so both the original observer and the settling-window caller receive the SAME single terminal outcome from finalize's one snapshot; once finalize has run, recovering is false and the caller instead starts a fresh connection. finalizeTerminalSettle now also CARRIES and re-checks its EpisodeControl (currentControl === control) before releasing the gate / clearing observers, so a stale finalize can never unconditionally wipe a changed coordinator state. Finally, both settleSuccess and settleFailure now wrap the Host teardown (onRecoverySuccess / onRecoveryFailureCleanup) in try/catch so a throwing teardown can no longer strand the PaymentManager gate / recovering flag: finalizeTerminalSettle is guaranteed to run and release the gate even if teardown throws (addresses the review-A 'host-teardown throw strands the gate' observation).",
    "semantics_unchanged": "The single 5000ms budget (RECOVERY_BUDGET_MS) and single-attempt (one rebuild) semantics are UNCHANGED. The watchdog is NOT a second attempt: it only moves 'deadline reached => settle' from poll-continuation-dependent to scheduling-independent. The terminal callback remains exactly one onDisconnected with error code 213 on failure (never onError) and one onConnected on success. No public API, no error code, no onError/onDisconnected contract changes.",
    "injectability_rationale": "The watchdog delay cannot hardcode Dispatchers.Default or a bare delay(RECOVERY_BUDGET_MS), because existing tests reflectively swap the coordinator scope to Dispatchers.Unconfined and inject a fast StepClock; a real-time 5000ms delay would turn deterministic millisecond tests into real multi-second waits. The watchdog therefore (a) judges the deadline via the SAME injected clock (clock.elapsedRealtimeMs() vs episode.deadlineElapsedMs) and (b) runs on an injectable watchdogDispatcher/watchdogScope (default Dispatchers.Default; tests pin it to Unconfined). This both fixes the production Main-starvation defect and keeps the existing/new tests deterministic."
  },
