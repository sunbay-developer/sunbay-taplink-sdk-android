    "implementation": "Budget enforcement depended on pollUntilReadyOrDeadline() re-reading the clock from delay(50) continuations on the Main-confined episode scope (EstablishedRecoveryCoordinator.kt pollUntilReadyOrDeadline). There was no deadline-reached timer independent of that scheduling. runEpisode's catch (CancellationException) branch rethrew without settling, delegating the terminal outcome to onExplicitDetachOrDisconnect(), which is the only canceller and delivers no callback by design."
