      "document_path": "docs/spec/sources/TAPLINK_ESTABLISHED_RECOVERY_REQUEST.md",
      "section": "S11. Q2 callback-silence decision (verbatim)",
      "source_quote": "恢复期间不发进度回调，仅终局一次结果回调，onError的回调也不给调用端",
      "content": "Recovery fully silent to callers (no onReconnecting, no transient onError, no transient onDisconnected); onError is scoped to connect() only and an established fault is never reported via onError; the SDK does not remove the registered ConnectionListener during recovery; exactly one terminal onConnected on success or one E213 onDisconnected on failure, deduplicated observers; Q2.",
      "verified": true,
      "resolution": "Q2 APPROVED by maintainer 2026-10-15 ('恢复期间不发进度回调，仅终局一次结果回调，onError的回调也不给调用端'), refined by S14 follow-up ('onError只在调用connect()时有对应回调，连接建立过后的onError不需要返回给他，我们sdk内部做恢复重试，并保证连接监听不被移除'): no progress or transient error callbacks; onError only for connect(); established faults never surface via onError; listener never removed by the SDK during recovery; a single terminal result only.",
      "related_sections": [
        "S14. Q2 follow-up: onError scope and listener retention (verbatim)"
      ]
    },
