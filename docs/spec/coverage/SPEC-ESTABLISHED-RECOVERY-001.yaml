  "rules": [
    {
      "rule_id": "R1",
      "source_id": "SRC-1",
      "source_type": "EXPLICIT",
      "dimension": "business_flow",
      "criticality": "critical",
      "statement": "An established SDK-managed connection faults -> SDK owns a recovery attempt before final disconnect; every concrete adapter follows the same policy.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC1",
          "given": "Established LAN/VSP/RS232/AOA/local/SUB_SCREEN, idle and in-flight variants",
          "when": "Fault event arrives",
          "then": "The common recovery owner is entered for each actual client adapter before terminal notification; Cloud is explicitly N/A.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-001"
          ]
        }
      ]
    },
    {
      "rule_id": "R2",
      "source_id": "SRC-2",
      "source_type": "EXPLICIT",
      "dimension": "business_flow",
      "criticality": "critical",
      "statement": "autoReconnect is omitted (default false), explicitly false or true -> the mandatory established recovery still has one attempt. Retry-count interaction is proposed separately in R4.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC2",
          "given": "autoReconnect omitted/false/true",
          "when": "Established connection fails",
          "then": "One mandatory recovery is eligible in every configuration; no boolean default bypass.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-002"
          ]
        }
      ]
    },
    {
      "rule_id": "R3",
      "source_id": "SRC-3",
      "source_type": "EXPLICIT",
      "dimension": "business_flow",
      "criticality": "critical",
      "statement": "No connection has succeeded in this logical session -> keep existing first-connect behavior; recovery-attempt failure cannot recursively become a new first-connect recovery.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC3",
          "given": "Initial connect never succeeded, plus failure during an already-running recovery",
          "when": "Connect/handshake fails",
          "then": "Initial policy remains unchanged; the recovery child does not start recursive recovery.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-003"
          ]
        }
      ]
    },
    {
      "rule_id": "R4",
      "source_id": "SRC-4",
      "source_type": "EXPLICIT",
      "dimension": "business_flow",
      "criticality": "critical",
      "statement": "One established fault episode -> one serialized same-protocol transport rebuild, no additional ReconnectManager/fast-recovery/mDNS/adaptor retry chain. Proposed budget: 5,000ms monotonic wall time including cleanup, device wait, handshake, readiness and cancellation; no retry delay. maxRetryCount=0 or positive does not change this one-attempt limit. Failure/exhaustion ends this episode without background retries.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC4",
          "given": "An established fault episode, maxRetryCount=0/3, duplicate fault events and slow adapter",
          "when": "Failures race or deadline reaches 5,000ms",
          "then": "Exactly one rebuild attempt at most; failed prerequisites do not spin; no stacked mDNS/fast/regular loops, and an expired attempt cannot later succeed. A genuinely restored connection may start a new episode on a new fault.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-004"
          ]
        }
      ],
      "approved_by": "Q1 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R5",
      "source_id": "SRC-4",
      "source_type": "EXPLICIT",
      "dimension": "state_and_rules",
      "criticality": "critical",
      "statement": "A fault is observed -> synchronously claim a recovery epoch before any public callback or PaymentManager physical-disconnect cleanup. Keep logical recovery nonterminal; isConnected=false and isConnecting=true. Transport ERROR/DISCONNECTED are diagnostics, not final public outcomes.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC5",
          "given": "Read/write/probe plus status/close events in every ordering",
          "when": "First fault is detected",
          "then": "Ownership is claimed first; isConnected=false/isConnecting=true; no public transient error/disconnect and no physical-disconnect payment cleanup.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-005"
          ]
        }
      ],
      "approved_by": "Q1 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R6",
      "source_id": "SRC-5",
      "source_type": "EXPLICIT",
      "dimension": "state_and_rules",
      "criticality": "critical",
      "statement": "onError is scoped to the explicit connect() action only; a fault on an already-established connection is NOT an onError case and is never reported to callers via onError. The SDK absorbs the established fault and runs the one recovery. During recovery emit NO onReconnecting progress, NO onError and NO transient onDisconnected, including autoReconnect=false; transport ERROR/DISCONNECTED mid-attempt are diagnostics only. The registered ConnectionListener MUST NOT be removed by the SDK during recovery (success or failure); only the caller's explicit removeConnectionListener()/disconnect() removes it (R9), so the terminal callback still reaches it. Exactly one terminal callback per distinct observer: recovery succeeds -> one onConnected with no paired onError/onDisconnected for the recovered fault; recovery fails -> one onDisconnected with existing E213 and diagnostic cause and NO onError in any case. Queued callers joining the episode receive only that single terminal outcome once and are released.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC6",
          "given": "Shared connect/global listener, distinct listeners and queued connect callers",
          "when": "Recovery succeeds or fails",
          "then": "onError is never invoked for an established-connection fault (onError stays scoped to connect() failures). No onReconnecting and no transient onDisconnected reach any observer during the attempt, including autoReconnect=false. The registered ConnectionListener stays attached throughout recovery (the SDK does not remove it); only an explicit caller removeConnectionListener()/disconnect() detaches it. Each distinct observer gets exactly one terminal callback: one onConnected on success or one E213-reason onDisconnected on failure, with no onError either way; queued callers receive that single terminal outcome once and all pending callers are released.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-006"
          ]
        }
      ],
      "approved_by": "Q2 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R7",
      "source_id": "SRC-4",
      "source_type": "EXPLICIT",
      "dimension": "interface_boundary",
      "criticality": "critical",
      "statement": "Recovery starts -> retire the old epoch, cancel its tasks and await safe resource release before opening a successor. Old read/write/status/close/permission/handshake callbacks cannot mutate the successor, close its resources or emit outcomes. A deadline expiry fences a stuck cleanup and terminates recovery without opening overlapping resources.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC7",
          "given": "Blocking old read, late status/permission/handshake and delayed cleanup",
          "when": "Recovery starts/expires",
          "then": "No successor opens before old release; no stale callback mutates or closes a successor; stuck cleanup is fenced and budget ends once.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-007"
          ]
        }
      ],
      "approved_by": "Q1 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R8",
      "source_id": "SRC-6",
      "source_type": "EXPLICIT",
      "dimension": "interface_boundary",
      "criticality": "critical",
      "statement": "Recovery selects peer -> retain the original protocol/configuration and validate the original terminal identity; VID/PID or USB bus path alone are insufficient. Missing reliable identity or rejected peer ends the single attempt with disconnect; never silently select another terminal. SUB_SCREEN success requires transport plus screen initialization.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC8",
          "given": "Same terminal, different terminal with identical VID/PID, missing identity, SUB_SCREEN activation failure",
          "when": "Rebuild appears physically connected",
          "then": "Only validated original target with full readiness succeeds; no protocol switch, ambiguous target acceptance or transport-only SUB_SCREEN success.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-008"
          ]
        }
      ],
      "approved_by": "Q3 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R9",
      "source_id": "SRC-4",
      "source_type": "EXPLICIT",
      "dimension": "interface_boundary",
      "criticality": "critical",
      "statement": "User disconnect, SDK cleanup or superseding connect -> cancel/fence recovery; no later old success, error or new connection. Manual disconnect emits once. New config starts a fresh logical session; same-config connect joins the current attempt rather than reopening a second transport. Throwing listeners cannot prevent cleanup or delivery to other distinct listeners.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC9",
          "given": "Recovery running, listener throws, connect requests race",
          "when": "Manual disconnect / cleanup / superseding config / same config",
          "then": "Cancel and fence old epoch; same config joins; new config starts fresh; manual disconnect and other observers receive one appropriate outcome.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-009"
          ]
        }
      ],
      "approved_by": "Q1 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R10",
      "source_id": "SRC-7",
      "source_type": "EXPLICIT",
      "dimension": "exception_and_risk",
      "criticality": "critical",
      "statement": "In-flight request exists -> preserve its callbacks/dedup during recovery without extending the original request deadline; never resend a possibly submitted payment, even through processPendingTransaction on recovery success. Successful recovery must reconnect the original receive-routing chain so original traceId responses continue into the original PaymentCallback (R15); do not clear/fail/re-register it or reset its deadline to make recovery appear successful. Recovery FAILURE (Q4 approved) -> on the single final disconnect, clear/fail the in-flight transaction callbacks through the existing physical-disconnect/failAllPendingTransactions cleanup, released once alongside the one terminal onDisconnected(E213); this cleanup must not run before or during the attempt (no synthetic early E306). Normal final-response versus original request-timeout races must complete once.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC10",
          "given": "Submitted payment, active dedup and deadline; final response races timeout",
          "when": "Recover succeeds/fails",
          "then": "On successful recovery no payment replay including processPendingTransaction; retain original callback mapping, deadline and terminal dedup. Original final response or original request timeout completes once; recovery success cannot be preceded by synthetic connection-error/E306 cleanup. On recovery FAILURE the in-flight transaction callbacks are cleared/failed via the existing physical-disconnect cleanup exactly once together with the single terminal onDisconnected(E213), never earlier and never as a synthetic E306.",
          "verification_method": "planned_controller_and_real_receive_routing_integration",
          "test_cases": [
            "TC-ER-010"
          ]
        }
      ],
      "approved_by": "Q4 (maintainer 2026-10-15)",
      "related_sources": [
        "SRC-11"
      ]
    },
    {
      "rule_id": "R11",
      "source_id": "SRC-7",
      "source_type": "EXPLICIT",
      "dimension": "exception_and_risk",
      "criticality": "critical",
      "statement": "A request is submitted while recovery is active -> reject it before serialization/send with existing E213, do not queue or replay it. Existing request timeout continues; its expiry does not create another recovery episode. Error 307/308 and all business-result semantics remain unchanged.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC11",
          "given": "Recovery running and a new payment request",
          "when": "Caller submits",
          "then": "Return existing E213 before send with no hidden queue; existing timeout/307/308/result tri-state behavior preserved.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-011"
          ]
        }
      ],
      "approved_by": "Q4 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R12",
      "source_id": "SRC-4",
      "source_type": "EXPLICIT",
      "dimension": "exception_and_risk",
      "criticality": "critical",
      "statement": "USB temporarily absent during mandatory recovery -> await one eligible re-enumeration/attach within the remaining common budget, then open at most once; do not fail immediately or restart the budget. Missing/denied USB permission or missing AIDL target -> fail the prerequisite evaluation without automatic permission prompts or loops. A prerequisite refusal counts as a failed attempt, not permission to switch protocol/target.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC12",
          "given": "Permission denied, USB absent or AIDL target unavailable",
          "when": "Mandatory attempt evaluates prerequisites",
          "then": "A transiently absent USB peer appearing within the remaining budget can open once and recover; absence through deadline disconnects once. Denied permission/missing AIDL target fails prerequisite evaluation without prompts/loops; later explicit connect remains possible.",
          "verification_method": "planned_unit_and_adapter_regression",
          "test_cases": [
            "TC-ER-012"
          ]
        }
      ],
      "approved_by": "Q1 (maintainer 2026-10-15)"
    },
    {
      "rule_id": "R13",
      "source_id": "SRC-8",
