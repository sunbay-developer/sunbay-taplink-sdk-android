  "rules": [
    {
      "rule_id": "R1",
      "source_id": "SRC-1",
      "source_type": "EXPLICIT",
      "dimension": "business_flow",
      "criticality": "high",
      "statement": "Auto-reconnect enabled: a failed initial LAN endpoint must not emit a terminal connection failure before attempting recovery to the discovered endpoint.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC1",
          "given": "autoReconnect=true, stale port 8445 and same-device discovery at 8443",
          "when": "old endpoint fails and replacement succeeds",
          "then": "onConnected is delivered; neither onError nor onDisconnected is emitted for the failed handshake",
          "verification_method": "unit_test_and_callback_integration",
          "test_cases": [
            "TC-LAN-RECOVERY-001"
          ]
        }
      ]
    },
    {
      "rule_id": "R2",
      "source_id": "SRC-2",
      "source_type": "EXPLICIT",
      "dimension": "state_and_rules",
      "criticality": "high",
      "statement": "Keep the logical attempt connecting during recoverable handshake error/close; suppress paired transport-close state regression regardless of callback ordering.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC2",
          "given": "fallback eligible and no established socket",
          "when": "transport error and close occur in either order while discovery is pending",
          "then": "isConnecting remains true; ERROR/DISCONNECTED and public terminal callbacks are absent",
          "verification_method": "unit_test_and_callback_integration",
          "test_cases": [
            "TC-LAN-RECOVERY-002"
          ]
        }
      ]
    },
    {
      "rule_id": "R3",
      "source_id": "SRC-2",
      "source_type": "EXPLICIT",
      "dimension": "exception_and_risk",
      "criticality": "high",
      "statement": "When recovery has no acceptable target or replacement connection fails and configured recovery is exhausted, terminate the logical attempt and report a final connection error once per listener, with no handshake-generated duplicate disconnect.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC3",
          "given": "autoReconnect=true; no target, discovery exception, missing/rejecting address-change listener without accepted handoff, or failed replacement connection",
          "when": "existing bounded recovery is exhausted or a non-retryable failure terminates it",
          "then": "connecting ends; each distinct listener instance (including a shared connect/global listener and queued reconnect callers) gets one final onError for this eligible LAN recovery attempt, no duplicate handshake onDisconnected; pending reconnect callers are released and reconnect state ends; a subsequent explicit connect can proceed",
          "verification_method": "unit_test_and_callback_integration",
          "test_cases": [
            "TC-LAN-RECOVERY-003"
          ]
        }
      ]
    },
    {
      "rule_id": "R4",
      "source_id": "SRC-2",
      "source_type": "EXPLICIT",
      "dimension": "interface_boundary",
      "criticality": "high",
      "statement": "autoReconnect=false retains direct failure reporting and disables discovery recovery; errors remain existing codes.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC4",
          "given": "autoReconnect=false and refused endpoint",
          "when": "direct connection fails",
          "then": "existing direct failure reporting is preserved without discovery or new-port connection; this task does not add a handshake disconnect or redesign disabled-reconnect error deduplication",
          "verification_method": "unit_test_and_callback_integration",
          "test_cases": [
            "TC-LAN-RECOVERY-004"
          ]
        }
      ]
    },
    {
      "rule_id": "R5",
      "source_id": "SRC-2",
      "source_type": "EXPLICIT",
      "dimension": "exception_and_risk",
      "criticality": "high",
      "statement": "Manual disconnect, superseding connection or cleanup cancels pending recovery; obsolete callbacks cannot report success/failure or start a replacement for the cancelled attempt.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC5",
          "given": "discovery/replacement connection pending",
          "when": "user disconnects, switches connection or cleans up",
          "then": "old attempt produces no later recovery success/error or new connection; explicit disconnect follows the existing API contract",
          "verification_method": "unit_test_and_callback_integration",
          "test_cases": [
            "TC-LAN-RECOVERY-005"
          ]
        }
      ]
    },
    {
      "rule_id": "R6",
      "source_id": "SRC-2",
      "source_type": "EXPLICIT",
      "dimension": "acceptance_coverage",
      "criticality": "high",
      "statement": "Scope the deferral to pre-connection LAN handshake recovery; preserve established-link errors and existing in-flight fast recovery budgets, transaction callbacks and query-first rules.",
      "status": "APPROVED",
      "acceptance": [
        {
          "ac_id": "AC6",
          "given": "established link error or transaction fast recovery path",
          "when": "transport failure occurs",
          "then": "existing error/recovery path remains operative; no broadened error suppression, transaction resubmission or change to the existing fast-recovery path",
          "verification_method": "unit_test_and_callback_integration",
          "test_cases": [
            "TC-LAN-RECOVERY-006"
          ]
        }
      ]
    }
  ],
