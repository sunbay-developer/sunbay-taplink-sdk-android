    {
      "source_id": "SRC-7",
      "classification": "EXPLICIT",
      "document_id": "AGENT-TAPLINKSDK",
      "document_version": "2026-10-19 工作区快照",
      "document_path": "AGENT.md",
      "section": "4. 交易语义铁律（Critical Semantics — 不可违反）",
      "source_quote": "1. **`onSuccess` ≠ 交易已批准**：调用方必须检查 `PaymentResult.isSuccess()` / `isProcessing()` / `isFailed()`，SDK 内部实现和示例代码也必须体现这一语义，不能简化。\n2. **`onFailure` 只代表通信/系统级错误**，绝不能在文档或示例中把卡片拒绝、用户取消等业务结果映射到 `onFailure`。\n3. **金额单位**：`AmountInfo` 一律使用最小货币单位（分）。`orderAmount` 与 `tipAmount`/`tipConfig` **互斥**（不可同时设置 tipAmount 和 tipConfig），且 `orderAmount` 不得混入小费金额。\n4. **`transactionRequestId`**：每次新交易必须全局唯一（UUID/时间戳），API 层应对重复 ID 做防御性校验或至少在文档中强调。\n5. **错误码 306（超时）**：SDK 与文档必须明确指导集成方\"先查询、后决策\"，任何自带的重试逻辑都不能对 306 做自动重试。\n6. **错误码 307/308**：必须使用新的 `transactionRequestId` 重试，不能复用旧 ID。\n7. **INIT 流程对集成方透明**：不提供公开 API 让外部手动触发 INIT；INIT 在首笔交易时自动运行，连接断开重连后状态被清除。\n8. **Refund 两种模式**：`referencedBuilder()`（有原交易 ID，优先使用）与 `nonReferencedBuilder()`（无原交易 ID，需要客户重新刷卡）——两者语义、Builder API 必须保持清晰区分，不可合并成一个易混淆的接口。\n9. **Abort 前置条件**：仅允许在网关授权前调用；已授权交易必须使用 Void/Refund。\n10. **线程安全**：`TaplinkSDK` 的静态方法必须保证线程安全，可从任意线程调用；`PaymentCallback`/`ConnectionListener` 的实现类文档必须明确告知回调可能运行在后台线程，调用方需自行切换主线程。\n11. **生命周期清理**：文档与示例代码必须展示 `disconnect()` + `removeConnectionListener()` 成对出现，缺一不可。",
      "content": "306 query-first、三态、金额、ID、Abort 资格等保留；逐条核对 AGENT §4，不据通信错误推断资金失败。",
      "derivation": null,
      "conflict_with": null,
      "verified": false,
      "resolution": null
    },
