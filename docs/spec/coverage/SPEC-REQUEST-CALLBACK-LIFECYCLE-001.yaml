      "document_path": "docs/spec/sources/TAPLINK_ONERROR_CALLBACK_LIFECYCLE_REQUEST.md",
      "section": "S2. onError 处理顺序澄清（原文）",
      "source_quote": "`onError`本来就不需要被移除，需要`onError`的重试结果拿到后再决定是否移除",
      "content": "收到通信 onError 不立即移除回调；先拿恢复重试结果。",
