      "section": "S5. Host active 规格摘录快照（非新批准）",
      "source_quote": "保留绑定：不 invalidate、不暂存 TTL；仅 `currentClient.compareAndSet(conn, null)` + 刷新客户端缓存后返回；掉线期间不发 `onDisconnected`、不置 `WAITING_CONNECT`（与现状分支 2 的「暂存」语义一致，但去掉 TTL 与 IP key）",
      "content": "Host active R3 被动掉线保留行为；对应当前源码见设计 §2.2。",
