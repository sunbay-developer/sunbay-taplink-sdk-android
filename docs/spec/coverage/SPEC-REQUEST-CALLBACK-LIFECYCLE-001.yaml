      "section": "2.4.2 In-flight continuation priority",
      "source_quote": "Reconnect succeeds while an original transaction is in flight -> keep the original callback and traceId/transactionRequestId correlation, attach the rebuilt receive path to that same mapping, and deliver continued progress/final responses through the original PaymentCallback using the existing continuation mechanism. Do not start or resend a transaction, silently replace its callback, or lose terminal dedup state.",
