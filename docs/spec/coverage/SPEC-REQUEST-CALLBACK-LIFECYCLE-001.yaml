    },
    {
      "source_id": "SRC-3",
      "classification": "EXPLICIT",
      "document_id": "SPEC-ESTABLISHED-RECOVERY-001",
      "document_version": "v1.2",
      "document_path": "docs/spec/TAPLINK_ESTABLISHED_RECOVERY_SPEC.md",
      "section": "2.4 Transactions, errors and compatibility",
      "source_quote": "In-flight request exists -> preserve its callbacks/dedup during recovery without extending the original request deadline; never resend a possibly submitted payment, even through processPendingTransaction on recovery success. Successful recovery must reconnect the original receive-routing chain so original traceId responses continue into the original PaymentCallback (R15); do not clear/fail/re-register it or reset its deadline to make recovery appear successful. Recovery FAILURE (Q4, maintainer 2026-10-15: \"恢复失败后的交易 callback 都被清除了\") -> on the single final disconnect, clear/fail the in-flight transaction callbacks through the existing physical-disconnect/failAllPendingTransactions cleanup path, released exactly once alongside the one terminal onDisconnected(E213); this cleanup must not run before or during the attempt (no synthetic early E306), only at the terminal failure. Normal final-response versus original request-timeout races must complete once.",
      "content": "已批准 R10/R15：成功续推、原 deadline、无支付重发。",
      "derivation": null,
      "conflict_with": null,
      "verified": false,
      "resolution": null
    },
    {
      "source_id": "SRC-4",
      "classification": "EXPLICIT",
      "document_id": "SPEC-ESTABLISHED-RECOVERY-001",
      "document_version": "v1.2",
      "document_path": "docs/spec/TAPLINK_ESTABLISHED_RECOVERY_SPEC.md",
      "section": "2.2 State and callback ownership",
      "source_quote": "The registered ConnectionListener MUST NOT be removed by the SDK during recovery (success or failure)",
      "content": "已批准 R6：全局连接监听保留；恢复终局与单笔请求回调分开。",
      "derivation": null,
